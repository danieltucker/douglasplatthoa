# ─────────────────────────────────────────────────────────────────────────────
# HOA Document Password Protection — nginx config snippet
#
# HOW TO USE:
#   1. Copy .htpasswd to a safe location outside your web root, e.g.:
#         /etc/nginx/.htpasswd
#      or if you must keep it in the project, make sure it's above public_html.
#
#   2. Add the location block below inside your existing nginx server {} block.
#      Replace /var/www/hoa with your actual web root path, and update the
#      auth_basic_user_file path to wherever you placed .htpasswd.
#
#   3. Reload nginx:
#         sudo nginx -t && sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────

server {
    # ... your existing server block config (listen, server_name, root, etc.) ...

    # Password-protect the HOA documents folder
    location /HOA/ {
        auth_basic "HOA Documents — Contact board@ferndalehoa.com for access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
