# ─────────────────────────────────────────────────────────────────────────────
# HOA Documents — access notes  (UPDATED June 2026)
#
# WHAT CHANGED:
#   Document access used to be protected with nginx HTTP Basic Auth, which made
#   the browser show a native popup asking for BOTH a username and a password.
#   Homeowners found that confusing (especially the username), so it has been
#   replaced with a single shared "community password" entered right on the
#   Documents page itself (see documents.html).
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │  ACTION REQUIRED ON THE SERVER:                                             │
# │  Remove the old Basic Auth block so the browser popup stops appearing.      │
# │  If the popup keeps firing, the in-page password screen is useless.         │
# └───────────────────────────────────────────────────────────────────────────┘
#
#   1. Edit the live nginx server {} block and DELETE the old location block:
#
#         location /HOA/ {
#             auth_basic "HOA Documents — ...";
#             auth_basic_user_file /etc/nginx/.htpasswd;
#         }
#
#      (Just remove it entirely — the /HOA/ folder should be served normally,
#       with no auth_basic.)
#
#   2. Reload nginx:
#         sudo nginx -t && sudo systemctl reload nginx
#
#   3. The /etc/nginx/.htpasswd file is no longer used and can be deleted.
#
# ─────────────────────────────────────────────────────────────────────────────
#
# HOW THE PASSWORD WORKS NOW:
#   * The community password lives in documents.html, in the small <script> block
#     near the bottom of the file (look for DOCS_PASSWORD). Change that one line
#     to update the password. It is not case-sensitive.
#   * Once a resident enters it correctly, their browser remembers it so they
#     are not asked again on that device.
#   * This is light, convenience-level protection only (the document files
#     themselves are publicly reachable by direct URL). That is an intentional
#     trade-off to keep access simple for homeowners.
